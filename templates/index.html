{% extends "base.html" %}
{% block content %}
<div class="card">
<h1>Users</h1>
<ul>
    {% for user in users %}
        <li><a href="{{ url_for('user_movies', user_id=user.id) }}">{{ user.name }}</a></li>
    {% else %}
        <li>No users yet.</li>
    {% endfor %}
</ul>
<h2>Add a new user</h2>
<form method="POST" action="{{ url_for('create_user') }}">
    <input type="text" name="name" placeholder="Enter user name" required>
    <button type="submit">Add User</button>
</form>
</div>
{% endblock %}
